<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPulse - Modern Social Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-2xl font-black bg-gradient-to-r from-indigo-500 to-pink-500 bg-clip-text text-transparent">PixelPulse</h1>
            <span class="text-xs font-semibold px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full">Python Docker App</span>
        </div>
    </nav>

    <!-- Main Wrapper -->
    <main class="max-w-xl mx-auto px-4 py-6 space-y-6">

        <!-- Create Post Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400 mb-3">Create Post</h2>
            <form action="/add" method="POST" class="space-y-3">
                <input type="text" name="username" placeholder="Your handle (e.g. alex_dev)" required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50">
                <input type="url" name="image_url" placeholder="Paste Image URL from the internet (Unsplash, etc.)" 
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50">
                <textarea name="caption" rows="2" placeholder="Write an inspiring caption..." required
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50"></textarea>
                <button type="submit" 
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl transition shadow-sm shadow-indigo-100 text-sm">
                    Share to Feed
                </button>
            </form>
        </div>

        <!-- Social Media Feed Stream -->
        <div class="space-y-6">
            {% for post in posts %}
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <!-- Post Author Header -->
                <div class="flex items-center px-4 py-3 space-x-3">
                    <img src="{{ post.avatar }}" alt="avatar" class="w-10 h-10 rounded-full object-cover border border-slate-100">
                    <div>
                        <h3 class="font-semibold text-sm text-slate-900">@{{ post.username }}</h3>
                        <span class="text-xs text-slate-400">Shared via Docker container</span>
                    </div>
                </div>

                <!-- Post Image from Internet -->
                <div class="bg-slate-100 max-h-[500px] overflow-hidden flex items-center justify-center">
                    <img src="{{ post.image }}" alt="Post image" class="w-full object-cover">
                </div>

                <!-- Post Content & Stats -->
                <div class="p-4 space-y-2">
                    <div class="flex items-center space-x-2 text-slate-600">
                        <svg class="w-5 h-5 text-pink-500 fill-current" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <span class="text-sm font-semibold text-slate-700">{{ post.likes }} likes</span>
                    </div>
                    <p class="text-sm text-slate-700">
                        <span class="font-semibold text-slate-900 mr-2">@{{ post.username }}</span>{{ post.caption }}
                    </p>
                </div>
            </div>
            {% endfor %}
        </div>

    </main>
</body>
</html>
